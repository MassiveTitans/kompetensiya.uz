# /etc/nginx/sites-available/test.kompetensiya.uz
#
# Bu subdomen SAYT EMAS. Uning yagona vazifasi — ONE ID kabinetida
# ro'yxatdan o'tkazilgan callback manzilini qabul qilib, so'rovni
# `code` va `state` parametrlari bilan birga kompetensiya.uz ga uzatish.
#
# ONE ID oqimi:
#   1. Foydalanuvchi kompetensiya.uz da "ONE ID orqali kirish" ni bosadi
#   2. Django sso.egov.uz ga yo'naltiradi,
#      redirect_uri = https://test.kompetensiya.uz/one-id/callback
#   3. ONE ID shu manzilga ?code=...&state=... bilan qaytadi
#   4. Nginx uni kompetensiya.uz/one-id/callback ga o'tkazadi (parametrlar saqlanadi)
#   5. Django kodni tokenga almashtiradi va foydalanuvchini kiritadi
#
# Sessiya cookie'si kompetensiya.uz domenida bo'lgani uchun `state`
# tekshiruvi 4-qadamda muammosiz o'tadi.

server {
    listen 80;
    listen [::]:80;
    server_name test.kompetensiya.uz;

    # Certbot sertifikatni yangilashi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.kompetensiya.uz;

    ssl_certificate     /etc/letsencrypt/live/test.kompetensiya.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.kompetensiya.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS vaqtincha o'chirilgan — sertifikat masalasi hal bo'lgach yoqiladi.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/one-id-callback.access.log;
    error_log  /var/log/nginx/one-id-callback.error.log;

    # ONE ID callback — slashli va slashsiz shakl.
    # 302 (doimiy emas): brauzer keshlab qolmasin.
    # $is_args$args — ?code=...&state=... saqlanadi.
    location = /one-id/callback {
        return 302 https://kompetensiya.uz/one-id/callback$is_args$args;
    }

    location = /one-id/callback/ {
        return 302 https://kompetensiya.uz/one-id/callback$is_args$args;
    }

    # Qolgan hamma so'rov asosiy saytga
    location / {
        return 302 https://kompetensiya.uz$request_uri;
    }
}
