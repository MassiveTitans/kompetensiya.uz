# /etc/nginx/sites-available/kompitensiya.uz
#
# VAQTINCHA VARIANT — SSL'siz ishlash uchun.
#
# Frontdagi proxy (192.168.1.240) ning Sectigo sertifikati 19-iyulda tugagan,
# shuning uchun HTTPS ishlamayapti. Bu konfig 80-portni HTTPS'ga
# YO'NALTIRMAYDI, saytni to'g'ridan-to'g'ri HTTP orqali beradi.
#
# Sertifikat tuzatilgach `nginx-kompetensiya.uz.conf` ga qayting.
#
# Muhim: Django tomonda ham `.env` da `DJANGO_SECURE_SSL=0` bo'lishi shart,
# aks holda Django o'zi HTTPS'ga yo'naltiraveradi.

server {
    listen 80;
    listen [::]:80;
    server_name kompetensiya.uz www.kompetensiya.uz;

    client_max_body_size 25M;

    access_log /var/log/nginx/kompetensiya.access.log;
    error_log  /var/log/nginx/kompetensiya.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /var/www/kompetensiya.uz/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/kompetensiya.uz/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

# HTTPS bloki saqlanadi — sertifikat ishlaganda ham ochiladi,
# lekin majburiy yo'naltirish yo'q.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kompetensiya.uz www.kompetensiya.uz;

    ssl_certificate     /etc/letsencrypt/live/kompetensiya.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kompetensiya.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    access_log /var/log/nginx/kompetensiya.access.log;
    error_log  /var/log/nginx/kompetensiya.error.log;

    location /static/ {
        alias /var/www/kompetensiya.uz/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/kompetensiya.uz/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
