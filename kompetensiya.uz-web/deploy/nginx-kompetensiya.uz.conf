# /etc/nginx/sites-available/kompitensiya.uz
#          ^ e'tibor bering: serverdagi fayl nomida yozuv xatosi bor
#            (kompItensiya). Symlink ham shu nom bilan — o'zgartirmang,
#            aks holda sites-enabled dagi havola uziladi.
#
# 2-BOSQICH: asosiy domen yangi Django ilovasiga buriladi.
# Buni faqat test.kompetensiya.uz da hammasi ishlagach qo'llang.
#
# Eski konfigni saqlashni unutmang:
#   sudo cp /etc/nginx/sites-available/kompitensiya.uz \
#           /root/kompitensiya.uz.eski-$(date +%F)

server {
    listen 80;
    listen [::]:80;
    server_name kompetensiya.uz www.kompetensiya.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kompetensiya.uz$request_uri;
    }
}

server {
    # http2 — nginx 1.18 (Ubuntu 22.04) sintaksisi.
    # nginx 1.25+ da bu eskirgan, o'rniga alohida `http2 on;` yoziladi.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kompetensiya.uz;

    ssl_certificate     /etc/letsencrypt/live/kompetensiya.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kompetensiya.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kompetensiya.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kompetensiya.uz;

    ssl_certificate     /etc/letsencrypt/live/kompetensiya.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kompetensiya.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — VAQTINCHA O'CHIRILGAN.
    # Frontdagi proxy (192.168.1.240) ning sertifikati muddati tugagan.
    # HSTS yoqilsa brauzer "baribir davom etish" imkonini ham bermaydi.
    # Barcha subdomenlar sertifikati tartibga solingach shu qatorni oching:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;

    access_log /var/log/nginx/kompetensiya.access.log;
    error_log  /var/log/nginx/kompetensiya.error.log;

    location /static/ {
        alias /var/www/kompetensiya.uz/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/kompetensiya.uz/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
